<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hello 预览器</title>
    <style>
      /* 扩展自带样式：宿主不注入任何 CSS。主题走 ?theme= 并在切换时收到 postMessage。 */
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --line: #e5e7eb;
        --hover: #f3f4f6;
        --error: #b91c1c;
        --warn: #b45309;
        --info: #1d4ed8;
        --debug: #6b7280;
      }
      html[data-theme='dark'] {
        --bg: #0f1115;
        --fg: #e5e7eb;
        --muted: #9ca3af;
        --line: #262a33;
        --hover: #171a21;
        --error: #f87171;
        --warn: #fbbf24;
        --info: #93c5fd;
        --debug: #9ca3af;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--fg);
        font: 13px/1.6 system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        flex: none;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        display: flex;
        align-items: baseline;
        gap: 12px;
        flex-wrap: wrap;
      }
      header .name {
        font-weight: 600;
        font-size: 13.5px;
      }
      header .meta {
        color: var(--muted);
        font-size: 12px;
      }
      header .spacer {
        flex: 1;
      }
      header .stat {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      header .stat b {
        color: var(--fg);
        font-weight: 600;
      }
      .warn-truncated {
        color: var(--warn);
        font-size: 12px;
      }
      main {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      /* 日志视图：等宽、带行号、按级别着色 */
      .log {
        font: 12px/1.75 ui-monospace, SFMono-Regular, Consolas, monospace;
        padding: 8px 0;
      }
      .log .row {
        display: grid;
        grid-template-columns: 56px 1fr;
        gap: 10px;
        padding: 0 16px;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log .row:hover {
        background: var(--hover);
      }
      .log .ln {
        color: var(--muted);
        text-align: right;
        user-select: none;
        font-variant-numeric: tabular-nums;
      }
      .log .lv-error {
        color: var(--error);
      }
      .log .lv-warn {
        color: var(--warn);
      }
      .log .lv-info {
        color: var(--info);
      }
      .log .lv-debug {
        color: var(--debug);
      }
      /* 表格视图：首行当表头，粘性定位 */
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 12.5px;
      }
      th,
      td {
        border-bottom: 1px solid var(--line);
        padding: 6px 10px;
        text-align: left;
        vertical-align: top;
        max-width: 420px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      th {
        position: sticky;
        top: 0;
        background: var(--bg);
        font-weight: 600;
        z-index: 1;
      }
      tbody tr:hover {
        background: var(--hover);
      }
      td.num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .empty {
        padding: 40px 16px;
        color: var(--muted);
        text-align: center;
      }
      .plain {
        padding: 12px 16px;
        font: 12px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }
    </style>
  </head>
  <body>
    <header>
      <span class="name" id="title">等待宿主数据…</span>
      <span class="meta" id="meta"></span>
      <span class="spacer"></span>
      <span class="stat" id="stats"></span>
    </header>
    <main id="view">
      <div class="empty">宿主会把产物内容通过消息推过来，稍等片刻。</div>
    </main>

    <script>
      // ── 与宿主的约定 ────────────────────────────────────────────────
      // 通道名固定；宿主只认这个。消息类型见 src/types/extension.ts。
      const CHANNEL = 'nanowork-extension';
      /** 渲染上限：几万行的日志全塞进 DOM 会把 iframe 卡死 */
      const MAX_ROWS = 2000;

      const $title = document.getElementById('title');
      const $meta = document.getElementById('meta');
      const $stats = document.getElementById('stats');
      const $view = document.getElementById('view');

      const applyTheme = (mode) => {
        document.documentElement.dataset.theme = mode === 'dark' ? 'dark' : 'light';
      };
      applyTheme(new URLSearchParams(location.search).get('theme'));

      /** 回一条状态给宿主（宿主在弹层顶部显示） */
      const report = (text) => {
        window.parent.postMessage({ channel: CHANNEL, type: 'status', payload: { text } }, '*');
      };

      /** 人类可读的字节数 */
      const humanSize = (bytes) => {
        if (typeof bytes !== 'number' || bytes < 0) return '';
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      };

      /**
       * CSV 解析（够用的子集）。
       *
       * 处理成对的 `"` 包裹与 `""` 转义——不处理的话，含逗号的字段会错列，
       * 而「错列」是表格视图最没意义的失败模式（看起来有表，内容全串位）。
       */
      const parseCsv = (text) => {
        const rows = [];
        let row = [];
        let field = '';
        let quoted = false;
        for (let i = 0; i < text.length; i += 1) {
          const ch = text[i];
          if (quoted) {
            if (ch === '"' && text[i + 1] === '"') {
              field += '"';
              i += 1;
            } else if (ch === '"') {
              quoted = false;
            } else {
              field += ch;
            }
            continue;
          }
          if (ch === '"') {
            quoted = true;
          } else if (ch === ',') {
            row.push(field);
            field = '';
          } else if (ch === '\n') {
            row.push(field);
            rows.push(row);
            row = [];
            field = '';
          } else if (ch !== '\r') {
            field += ch;
          }
        }
        if (field !== '' || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        return rows;
      };

      /** 日志级别：行内出现独立单词 ERROR/WARN/INFO/DEBUG/TRACE 即着色 */
      const levelOf = (line) => {
        const m = /\b(ERROR|WARN(?:ING)?|INFO|DEBUG|TRACE)\b/i.exec(line);
        if (!m) return null;
        const word = m[1].toUpperCase();
        if (word.startsWith('ERROR')) return 'error';
        if (word.startsWith('WARN')) return 'warn';
        if (word.startsWith('INFO')) return 'info';
        return 'debug';
      };

      const renderLog = (text) => {
        const lines = text.split(/\r?\n/);
        const shown = lines.slice(0, MAX_ROWS);
        const counts = { error: 0, warn: 0, info: 0, debug: 0 };
        const frag = document.createDocumentFragment();
        const wrap = document.createElement('div');
        wrap.className = 'log';

        shown.forEach((line, index) => {
          const level = levelOf(line);
          if (level) counts[level] += 1;
          const row = document.createElement('div');
          row.className = 'row' + (level ? ' lv-' + level : '');
          const ln = document.createElement('span');
          ln.className = 'ln';
          ln.textContent = String(index + 1);
          const body = document.createElement('span');
          body.textContent = line.length > 0 ? line : ' ';
          row.append(ln, body);
          wrap.appendChild(row);
        });

        frag.appendChild(wrap);
        $view.replaceChildren(frag);

        const parts = [];
        if (counts.error) parts.push(`${counts.error} 错误`);
        if (counts.warn) parts.push(`${counts.warn} 警告`);
        if (counts.info) parts.push(`${counts.info} 信息`);
        $stats.textContent = parts.join(' · ');
        report(
          `已渲染 ${shown.length} 行` +
            (lines.length > shown.length ? `（共 ${lines.length} 行，已截断）` : ''),
        );
      };

      const renderCsv = (text) => {
        const rows = parseCsv(text);
        if (rows.length === 0) {
          $view.innerHTML = '<div class="empty">这个 CSV 没有内容。</div>';
          return;
        }
        const header = rows[0];
        const body = rows.slice(1, MAX_ROWS + 1);
        const table = document.createElement('table');

        const thead = document.createElement('thead');
        const headRow = document.createElement('tr');
        header.forEach((cell) => {
          const th = document.createElement('th');
          th.textContent = cell;
          headRow.appendChild(th);
        });
        thead.appendChild(headRow);
        table.appendChild(thead);

        const tbody = document.createElement('tbody');
        body.forEach((cells) => {
          const tr = document.createElement('tr');
          // 按表头宽度补齐：少列时补空 td，多列时截断（否则表格会挤出横向滚动条）
          for (let i = 0; i < header.length; i += 1) {
            const td = document.createElement('td');
            const value = cells[i] ?? '';
            td.textContent = value;
            if (value !== '' && !Number.isNaN(Number(value))) td.classList.add('num');
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);

        $view.replaceChildren(table);
        $stats.textContent = `${header.length} 列 · ${body.length} 行`;
        report(
          `已渲染 ${body.length} 行` +
            (rows.length - 1 > body.length ? `（共 ${rows.length - 1} 行，已截断）` : ''),
        );
      };

      const renderPlain = (text) => {
        const pre = document.createElement('div');
        pre.className = 'plain';
        const lines = text.split(/\r?\n/);
        pre.textContent = lines.slice(0, MAX_ROWS).join('\n');
        $view.replaceChildren(pre);
        $stats.textContent = `${lines.length} 行`;
        report(`已渲染 ${lines.length} 行`);
      };

      /** 宿主推来产物内容 */
      const renderContext = (context) => {
        const artifact = context && context.artifact;
        if (!artifact) return;

        $title.textContent = artifact.title || '(未命名产物)';
        $meta.textContent = [artifact.path, humanSize(artifact.size)]
          .filter(Boolean)
          .join(' · ');

        const text = typeof artifact.text === 'string' ? artifact.text : '';
        if (!text) {
          // 二进制 / 大文件：宿主只给了元信息。这不是错误，如实说明。
          $view.innerHTML =
            '<div class="empty">宿主没有提供文本内容（多为二进制或超出大小上限的文件）。<br />' +
            '扩展要读字节得自己起服务去读，宿主不替它读。</div>';
          report('无可显示的文本内容');
          return;
        }

        if (artifact.truncated) {
          const tip = document.createElement('div');
          tip.className = 'warn-truncated';
          tip.style.padding = '8px 16px 0';
          tip.textContent = '内容超过宿主上限，已截断显示。';
          $view.prepend(tip);
        }

        const bizType = context.bizType || '';
        if (bizType === 'ext:csv') renderCsv(text);
        else if (bizType === 'ext:log') renderLog(text);
        else renderPlain(text);
      };

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data || data.channel !== CHANNEL) return;
        if (data.type === 'theme' && data.payload) {
          applyTheme(data.payload.theme);
          return;
        }
        if (data.type === 'context' && data.payload) {
          renderContext(data.payload.context);
        }
      });

      // 主动问一次：宿主的 onLoad 补发可能早于本脚本注册监听（消息就丢了）。
      // 这条消息宿主收到后可以重发 context —— 目前宿主不处理该 type，
      // 所以这里同时把"我准备好了"当状态回报，便于排障。
      report('预览器已就绪，等待宿主数据…');
    </script>
  </body>
</html>
