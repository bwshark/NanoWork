[project]
name = "nanowork-cloud"
version = "0.1.0"
description = "nanowork V1.5 跨端同步服务端（认证 + LWW 同步），与 nanobot/ 并列"
requires-python = ">=3.11"

# 依赖刻意保持最小：MVP 只做「认证 + 行存同步」。
# 不引入 Node 服务、不依赖 nanowork 既有后端（当前不存在）——见 m6 §八 明确不做。
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "sqlmodel>=0.0.16",
    "pyjwt>=2.8",
    # 直接依赖 bcrypt 原生 API 而非 passlib：passlib 1.7.4 在 Python 3.12+ 与
    # bcrypt 4.x 的组合下会抛 "(trapped) error reading bcrypt version"。
    "bcrypt>=4.0",
    # `EmailStr`（认证接口的邮箱字段）的校验后端。
    # ⚠️ 代码里**没有一行 import email_validator** —— pydantic 在运行时才去找它，
    # 所以「扫一遍 import 看缺什么」永远查不到它。缺了的表现是服务**启动即崩**：
    # `ImportError: email-validator is not installed, run pip install 'pydantic[email]'`。
    # 宿主机 venv 里恰好装过，所以一直到容器化才暴露。
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.26",
    "ruff>=0.4",
]
# 知识库文档解析的**可选**依赖：`pip install -e ".[parse]"`。
# 不装也能跑——`.docx` / `.txt` / `.md` 走标准库；只有 PDF 上传会回 422 并提示安装命令。
# 刻意不做成硬依赖：PDF 文本层提取自己写不出来（字体编码 / CID / 对象流），
# 但也不该让"只用纯文本知识库"的部署被迫多装一个包。
parse = ["pypdf>=4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 包发现必须显式声明。setuptools 的 flat-layout 自动发现在「一个顶层目录」时侥幸能用，
# 但 `cloud/` 下还有 `docker/`（运维脚本）与 `tests/`：
#   `error: Multiple top-level packages discovered in a flat-layout: ['app', 'docker']`
# 这个错只在容器里构建 wheel 时炸（宿主机因为有 egg-info 恰好躲过），所以写死更安全。
[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# cloud/ 自带 venv，测试一律用它跑：
#   cloud/.venv/Scripts/python.exe -m pytest
# 与 nanobot/ 的测试方式分开（那里是只读参考，不得为它加测试依赖）——m6 §七。
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008 对 FastAPI 是误报：`Depends(...)` 写在参数默认值里是该框架的**唯一**写法，
# 没有别的位置可放。放开后其余 B 规则仍生效。
ignore = ["B008"]
